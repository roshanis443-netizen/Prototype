.dq.Low{color:#8a5208}.dq.Low i{background:#d98a14}.dq.Delayed i{background:#6b7a99}

.kp{padding:14px 16px;flex:1 1 200px}.kv{font-size:24px;font-weight:700;margin-top:4px}.ks{font-size:12px;color:#5b6780;margin-top:2px}

const {useState,useContext,useRef,useEffect,createContext}=React;
const html=htm.bind(React.createElement);
const Ctx=createContext();

CAMPS.forEach(c=>{if(c.dq==='Delayed')c.dq='Data incomplete';c.adsets.forEach(a=>{a.cid=c.id;a.ci=c.i;a.spend=c.spend*a.w;a.pspend=c.pspend*a.w;a.dq=c.dq;a.obj=c.obj;a.plat=c.plat})});
CAMPS[12].adsets=[];
const calc=(e,f,pf,nz)=>{if(!e.spend)return{nodata:true};const spend=e.spend*f,pspend=e.pspend*pf,ctr=e.ctr*(1+nz),cpc=e.cpc*(1-nz),clicks=spend/cpc,imps=clicks/(ctr/100),pclicks=pspend/e.pcpc,pimps=pclicks/(e.pctr/100);return{spend,pspend,ctr,cpc,pctr:e.pctr,pcpc:e.pcpc,clicks,imps,pclicks,pimps,cc:(ctr-e.pctr)/e.pctr*100,pc:(cpc-e.pcpc)/e.pcpc*100}};
const agg=ms=>{ms=ms.filter(m=>!m.nodata);if(!ms.length)return{nodata:true};const s=k=>ms.reduce((a,m)=>a+m[k],0),spend=s('spend'),pspend=s('pspend'),clicks=s('clicks'),imps=s('imps'),pclicks=s('pclicks'),pimps=s('pimps'),ctr=clicks/imps*100,pctr=pclicks/pimps*100,cpc=spend/clicks,pcpc=pspend/pclicks;return{spend,pspend,clicks,imps,pclicks,pimps,ctr,pctr,cpc,pcpc,cc:(ctr-pctr)/pctr*100,pc:(cpc-pcpc)/pcpc*100}};
const n0=v=>Math.round(v).toLocaleString('en-IN');
const cc=(v,good)=>Math.abs(v)<.5?'neu':(good>0?v>0:v<0)?'pos':'neg';

const Cells=({m})=>m.nodata?html`<${React.Fragment}>${[0,1,2,3,4,5,6].map(i=>html`<div key=${i} className="r neu">—</div>`)}<//>`:html`<${React.Fragment}><div className="r">₹${n0(m.spend)}</div><div className="r">${m.ctr.toFixed(2)}%</div><div className="r neu">${m.pctr.toFixed(2)}%</div><div className=${'r '+cc(m.cc,1)}>${ar(m.cc)}</div><div className="r">₹${m.cpc.toFixed(2)}</div><div className="r neu">₹${m.pcpc.toFixed(2)}</div><div className=${'r '+cc(m.pc,-1)}>${ar(m.pc)}</div><//>`;

function Controls(){const X=useContext(Ctx),{D,setD,F,setF}=X;
